plugins {
    id 'application'
}

apply from: file('../gradle/version.gradle')

group = 'com.inxups.minegpt'

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main {
        java.srcDir('../shared/src/main/java')
        resources.srcDir('../shared/src/main/resources')
    }
}

application {
    mainClass = 'com.inxups.minegpt.bridge.MineGPTBridgeMain'
}

processResources {
    inputs.property 'minegpt_version', minegptVersion
    filesMatching('minegpt-build.properties') {
        expand 'minegpt_version': minegptVersion
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.1'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // This matches Minecraft's development JVM configuration and guards against
    // an accidental IPv6 loopback regression.
    systemProperty 'java.net.preferIPv6Addresses', 'system'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
