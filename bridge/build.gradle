plugins {
    id 'application'
}

group = 'com.inxups.minegpt'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main {
        java.srcDir('../shared/src/main/java')
    }
}

application {
    mainClass = 'com.inxups.minegpt.bridge.MineGptBridgeMain'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.1'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // This matches Minecraft's development JVM configuration and guards against
    // an accidental IPv6 loopback regression.
    systemProperty 'java.net.preferIPv6Addresses', 'system'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
